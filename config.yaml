discovery:
  subdomain_enum: true
  port_scan: true
  scan_interval_hours: 24
  # Conservative defaults: see docs/RULES_OF_ENGAGEMENT.md before raising these.
  max_concurrency: 50
  connect_timeout: 2.0
  ports: []          # empty = discovery.ports.DEFAULT_PORTS

# What scanners are permitted to do. See core/profiles.py.
#   passive  - no active probing at all
#   safe     - non-destructive detection, medium severity and above (default)
#   thorough - broader coverage for targets you own; must be requested explicitly
scanning:
  profile: safe

enrichment:
  refresh_interval_hours: 24
  sources:
    - nvd
    - kev
    - epss

scoring:
  weights:
    kev_status: 0.35
    epss_score: 0.25
    asset_criticality: 0.25
    exposure_context: 0.15

integrations:
  slack_webhook_url: ""
  jira:
    enabled: false
