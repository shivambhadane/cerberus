discovery:
  subdomain_enum: true
  port_scan: true
  scan_interval_hours: 24
  # Conservative defaults: see docs/RULES_OF_ENGAGEMENT.md before raising these.
  max_concurrency: 50
  connect_timeout: 2.0
  ports: []          # empty = discovery.ports.DEFAULT_PORTS

enrichment:
  refresh_interval_hours: 24
  sources:
    - nvd
    - kev
    - epss

scoring:
  weights:
    kev_status: 0.35
    epss_score: 0.25
    asset_criticality: 0.25
    exposure_context: 0.15

integrations:
  slack_webhook_url: ""
  jira:
    enabled: false
