[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["nuclei", "nuclei-templates", ".venv"]

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B"]
# B008 is the standard FastAPI dependency-injection idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated by Alembic; regenerating would overwrite any manual formatting.
"migrations/versions/*.py" = ["E501"]
# conftest and scripts set sys.path before importing project modules.
"tests/conftest.py" = ["E402"]
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
